[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navigation-dataset"
version = "0.1.0"
description = "OpticalNav synthetic navigation episode dataset generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[project.scripts]
opticalnav = "navigation_dataset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
