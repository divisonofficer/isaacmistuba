[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsuba-converter"
version = "0.1.0"
description = "USD -> Mitsuba scene converter (for Isaac/Mitsuba sync)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Jinja2",
  "numpy",
  "Pillow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mitsuba_converter" = ["templates/*.html", "static/*.css"]
